<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="rm-build" content="20260809-3">
<title>RM Scheduler v2</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#f5f4ef;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif}
#bar{height:40px;display:flex;align-items:center;gap:10px;padding:0 14px;background:#202020;color:#fff;font-size:12px;box-sizing:border-box}
#bar strong{font-size:13px}.chip{padding:3px 8px;border-radius:999px;background:#333;color:#ddd;white-space:nowrap}.chip.ok{background:#1f6f43;color:#fff}.chip.warn{background:#8a5a00;color:#fff}
#status{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#d5d5d5}#legacy{color:#bbb;text-decoration:none}
#app{display:block;width:100%;height:calc(100% - 40px);border:0;background:#f5f4ef}
@media(max-width:720px){#bar{gap:5px;padding:0 8px}.optional{display:none}#legacy{display:none}}
</style>
</head>
<body>
<div id="bar"><strong>RM Scheduler v2</strong><span class="chip ok">날짜기반</span><span class="chip ok optional">수업길이</span><span class="chip ok optional">최대 2강사</span><span id="diag" class="chip">점검 중</span><span id="status">안전패치 로딩 중…</span><a id="legacy" href="legacy.html" target="_blank">기존버전</a></div>
<iframe id="app" src="legacy.html?v=legacy-20260809-3"></iframe>
<script>
const f=document.getElementById('app'),d=document.getElementById('diag'),st=document.getElementById('status');
let snapshotFresh=false;
function inject(src){return new Promise((ok,fail)=>{const s=f.contentDocument.createElement('script');s.src=src+'?v=20260809-3';s.onload=ok;s.onerror=()=>fail(new Error(src+' 로드 실패'));f.contentDocument.body.appendChild(s);});}
f.addEventListener('load',async()=>{try{await inject('v2-core.js');await inject('v2-ai.js');await inject('v2-io.js');await inject('v2-snapshot.js');await inject('v2-google.js');await inject('v2-calendar.js');await inject('v2-live-refresh.js');st.textContent='패치 로드 완료 · 스케줄링 시 강사 원본 Calendar 최신조회';}catch(e){d.className='chip warn';d.textContent='패치 실패';st.textContent=e.message;}});
addEventListener('message',e=>{
  if(e.origin!==location.origin||!e.data)return;
  if(e.data.type==='rmv2-ready'){
    const x=e.data.diag||{};d.className='chip '+(x.ok?'ok':'warn');d.textContent=x.ok?'자가점검 통과':'자가점검 실패';st.textContent=x.ok?'v2 '+x.version+' · 핵심 스케줄 점검 통과':'일부 안전패치 점검 실패';
  }
  if(e.data.type==='rmv2-snapshot-ready'){
    const x=e.data.snapshot||{};snapshotFresh=!!x.fresh;
    if(!x.fresh&&!f.contentWindow.__RMV2_GOOGLE__?.token?.()){d.className='chip warn';d.textContent='캘린더 확인';st.textContent='Google 직접연결 필요 · 스냅샷은 비상용';}
  }
  if(e.data.type==='rmv2-google-ready'){
    const x=e.data.google||{};
    if(x.connected){d.className='chip ok';d.textContent='실시간 Calendar';st.textContent='스케줄링 시 운영팀 Google Calendar 최신조회';}
  }
  if(e.data.type==='rmv2-live-refresh-ready'){
    const x=e.data.live||{};
    if(x.googleConnected){d.className='chip ok';d.textContent='실시간 Calendar';st.textContent='추천/충돌검사 때마다 5명 강사 Calendar 새로 조회';}
    else{d.className='chip warn';d.textContent='스냅샷 fallback';st.textContent='운영팀 Google 미연결 · 현재는 익명 BUSY 스냅샷 사용';}
  }
});
</script>
</body>
</html>
